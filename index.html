<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="HOOKD Method — content systems for creators, brands and businesses." />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <link rel="preload" href="/assets/logo.png" as="image" fetchpriority="high" />
    <link rel="preload" href="/work/video-01.mp4?v=5" as="video" type="video/mp4" fetchpriority="high" />
    <link rel="preload" href="/work/video-02.mp4?v=5" as="video" type="video/mp4" fetchpriority="high" />
    <link rel="preload" href="/work/video-03.mp4?v=5" as="video" type="video/mp4" fetchpriority="high" />
    <link rel="preload" href="/work/video-04.mp4?v=5" as="video" type="video/mp4" fetchpriority="high" />
    <link rel="preload" href="/work/video-05.mp4?v=5" as="video" type="video/mp4" fetchpriority="high" />
    <link rel="preload" href="/work/video-06.mp4?v=5" as="video" type="video/mp4" fetchpriority="high" />
    <link rel="preload" href="/work/video-07.mp4?v=5" as="video" type="video/mp4" fetchpriority="high" />
    <link rel="preload" href="/work/video-08.mp4?v=5" as="video" type="video/mp4" fetchpriority="high" />
    <link rel="preload" href="/work/video-09.mp4?v=5" as="video" type="video/mp4" fetchpriority="high" />
    <link rel="preload" href="/work/video-10.mp4?v=5" as="video" type="video/mp4" fetchpriority="high" />

    <style>
      #work {
        opacity: 0;
        transition: opacity 260ms ease;
      }

      body.work-videos-ready #work,
      body.work-videos-timeout #work {
        opacity: 1;
      }

      .marquee-track {
        animation-duration: 54s !important;
      }

      @media (max-width: 767px) {
        .marquee-track {
          animation-duration: 44s !important;
        }
      }
    </style>

    <script>
      (() => {
        const VERSION = "5";
        const TOTAL = 10;
        const urls = Array.from({ length: TOTAL }, (_, i) => `/work/video-${String(i + 1).padStart(2, "0")}.mp4?v=${VERSION}`);
        const loaded = new Set();
        const preloaders = [];
        let ready = false;

        const markReady = () => {
          if (ready) return;
          ready = true;
          document.body.classList.add("work-videos-ready");
          document.querySelectorAll("#work video").forEach((video) => {
            video.muted = true;
            video.defaultMuted = true;
            video.playsInline = true;
            video.loop = true;
            video.play().catch(() => {});
          });
        };

        const checkReady = () => {
          if (loaded.size >= TOTAL) markReady();
        };

        const preloadVideo = (src) => {
          const video = document.createElement("video");
          preloaders.push(video);
          video.src = src;
          video.muted = true;
          video.defaultMuted = true;
          video.playsInline = true;
          video.loop = true;
          video.preload = "auto";
          video.addEventListener("loadeddata", () => {
            loaded.add(src);
            checkReady();
          }, { once: true });
          video.addEventListener("canplay", () => {
            loaded.add(src);
            checkReady();
          }, { once: true });
          video.load();
        };

        urls.forEach(preloadVideo);

        const normalizeWorkVideos = () => {
          const videos = Array.from(document.querySelectorAll("#work video"));
          if (!videos.length) return;

          videos.forEach((video, index) => {
            const videoNumber = (index % TOTAL) + 1;
            const src = `/work/video-${String(videoNumber).padStart(2, "0")}.mp4?v=${VERSION}`;
            const source = video.querySelector("source");

            video.muted = true;
            video.defaultMuted = true;
            video.playsInline = true;
            video.loop = true;
            video.preload = "auto";
            video.style.transform = "translateZ(0)";
            video.style.backfaceVisibility = "hidden";
            video.style.willChange = "transform";

            if (source && source.getAttribute("src") !== src) {
              source.setAttribute("src", src);
              video.load();
            } else if (!source && video.getAttribute("src") !== src) {
              video.setAttribute("src", src);
              video.load();
            }

            if (ready) video.play().catch(() => {});
          });
        };

        const observer = new MutationObserver(normalizeWorkVideos);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        addEventListener("DOMContentLoaded", normalizeWorkVideos, { once: true });
        addEventListener("load", normalizeWorkVideos, { once: true });

        setTimeout(() => {
          if (!ready) {
            document.body.classList.add("work-videos-timeout");
            normalizeWorkVideos();
          }
        }, 5500);
      })();
    </script>

    <title>HOOKD Method</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
