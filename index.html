<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="HOOKD Method — content systems for creators, brands and businesses." />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <link rel="preload" href="/assets/logo.png" as="image" fetchpriority="high" />
    <link rel="preload" href="/work/video-01.mp4?v=3" as="video" type="video/mp4" fetchpriority="high" />
    <link rel="preload" href="/work/video-02.mp4?v=3" as="video" type="video/mp4" fetchpriority="high" />
    <link rel="preload" href="/work/video-03.mp4?v=3" as="video" type="video/mp4" fetchpriority="high" />
    <link rel="preload" href="/work/video-04.mp4?v=3" as="video" type="video/mp4" fetchpriority="high" />
    <link rel="preload" href="/work/video-05.mp4?v=3" as="video" type="video/mp4" fetchpriority="high" />

    <script>
      (() => {
        const criticalCount = matchMedia("(max-width: 767px)").matches ? 3 : 5;
        const criticalSources = Array.from({ length: criticalCount }, (_, i) => `/work/video-${String(i + 1).padStart(2, "0")}.mp4?v=3`);
        const warmed = new Set();

        const warmVideo = (src) => {
          if (!src || warmed.has(src)) return;
          warmed.add(src);
          const video = document.createElement("video");
          video.src = src;
          video.muted = true;
          video.defaultMuted = true;
          video.loop = true;
          video.playsInline = true;
          video.preload = "auto";
          video.load();
          video.play().then(() => video.pause()).catch(() => {});
        };

        criticalSources.forEach(warmVideo);

        const restoreSource = (source) => {
          if (!source || source.getAttribute("src")) return;
          const src = source.dataset.src;
          if (!src) return;
          source.setAttribute("src", src);
        };

        const deferSource = (video) => {
          const source = video.querySelector("source");
          if (!source || source.dataset.src) return;
          const src = source.getAttribute("src");
          if (!src) return;
          source.dataset.src = src;
          source.removeAttribute("src");
          try { video.load(); } catch (e) {}
        };

        const playVideo = (video) => {
          const source = video.querySelector("source");
          restoreSource(source);
          video.muted = true;
          video.defaultMuted = true;
          video.playsInline = true;
          video.loop = true;
          video.preload = "auto";
          video.style.transform = "translateZ(0)";
          video.style.backfaceVisibility = "hidden";
          try { video.load(); } catch (e) {}
          video.play().catch(() => {});
        };

        let hasIntersectionObserver = false;
        const optimize = () => {
          const cards = Array.from(document.querySelectorAll(".work-card"));
          if (!cards.length) return;
          const videos = cards.map((card) => card.querySelector("video")).filter(Boolean);

          videos.forEach((video, index) => {
            video.muted = true;
            video.defaultMuted = true;
            video.playsInline = true;
            video.style.transform = "translateZ(0)";
            video.style.backfaceVisibility = "hidden";

            if (index < criticalCount) {
              playVideo(video);
            } else {
              video.pause();
              video.preload = "none";
              deferSource(video);
            }
          });

          if (!hasIntersectionObserver && "IntersectionObserver" in window) {
            hasIntersectionObserver = true;
            const io = new IntersectionObserver((entries) => {
              entries.forEach((entry) => {
                if (!entry.isIntersecting) return;
                const video = entry.target.querySelector("video");
                if (video) playVideo(video);
              });
            }, { rootMargin: "1200px 1200px", threshold: 0.01 });
            cards.forEach((card) => io.observe(card));
          }

          const queueRest = () => {
            videos.slice(criticalCount).forEach((video, index) => {
              setTimeout(() => {
                const source = video.querySelector("source");
                const src = source && (source.dataset.src || source.getAttribute("src"));
                if (src) warmVideo(src);
              }, index * 220);
            });
          };

          if ("requestIdleCallback" in window) requestIdleCallback(queueRest, { timeout: 1800 });
          else setTimeout(queueRest, 1200);
        };

        new MutationObserver(optimize).observe(document.documentElement, { childList: true, subtree: true });
        addEventListener("DOMContentLoaded", optimize, { once: true });
        addEventListener("load", optimize, { once: true });
      })();
    </script>

    <title>HOOKD Method</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
