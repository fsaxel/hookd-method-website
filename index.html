<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="HOOKD Method — content systems for creators, brands and businesses." />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <link rel="preload" href="/assets/logo.png" as="image" fetchpriority="high" />
    <link rel="preload" href="/work/video-01.mp4?v=5" as="video" type="video/mp4" fetchpriority="high" />
    <link rel="preload" href="/work/video-02.mp4?v=5" as="video" type="video/mp4" fetchpriority="high" />
    <link rel="preload" href="/work/video-03.mp4?v=5" as="video" type="video/mp4" fetchpriority="high" />
    <title>HOOKD Method</title>

    <style>
      @keyframes workWiggle{0%{transform:translate3d(0,0,0) rotate(0deg)}25%{transform:translate3d(0,-2px,0) rotate(.35deg)}50%{transform:translate3d(0,0,0) rotate(0deg)}75%{transform:translate3d(0,2px,0) rotate(-.35deg)}100%{transform:translate3d(0,0,0) rotate(0deg)}}
      #work{position:relative;overflow:hidden!important;padding-top:24px!important;padding-bottom:32px!important}
      #work .marquee-track{animation:none!important;transform:none!important;width:min(100%,920px)!important;max-width:920px!important;margin:0 auto!important;display:grid!important;grid-template-columns:150px 250px 150px!important;align-items:center!important;justify-content:center!important;gap:22px!important;padding:0 54px!important;overflow:visible!important}
      #work .work-card{grid-row:1!important;margin:0!important;min-width:0!important;transition:opacity .65s cubic-bezier(.16,1,.3,1),transform .65s cubic-bezier(.16,1,.3,1),filter .65s cubic-bezier(.16,1,.3,1),box-shadow .65s cubic-bezier(.16,1,.3,1)!important;will-change:transform,opacity,filter!important;backface-visibility:hidden!important}
      #work .work-card.work-hidden{opacity:0!important;transform:scale(.8)!important;pointer-events:none!important;position:absolute!important}
      #work .work-card.work-main{grid-column:2!important;width:250px!important;height:438px!important;opacity:1!important;filter:none!important;transform:translate3d(0,0,0) scale(1)!important;z-index:30!important;pointer-events:auto!important;animation:workWiggle 5.5s ease-in-out infinite;box-shadow:0 28px 100px rgba(255,90,0,.16),0 0 0 1px rgba(255,255,255,.08)!important}
      #work .work-card.work-side-left{grid-column:1!important;width:150px!important;height:268px!important;opacity:.34!important;filter:saturate(.7) brightness(.52)!important;transform:translate3d(22px,0,0) scale(.9)!important;z-index:10!important;pointer-events:none!important;animation:workWiggle 7s ease-in-out infinite reverse;box-shadow:inset 0 0 90px rgba(0,0,0,.8),0 18px 60px rgba(0,0,0,.32)!important}
      #work .work-card.work-side-right{grid-column:3!important;width:150px!important;height:268px!important;opacity:.34!important;filter:saturate(.7) brightness(.52)!important;transform:translate3d(-22px,0,0) scale(.9)!important;z-index:10!important;pointer-events:none!important;animation:workWiggle 7s ease-in-out infinite;box-shadow:inset 0 0 90px rgba(0,0,0,.8),0 18px 60px rgba(0,0,0,.32)!important}
      #work .work-card video{transform:translateZ(0)!important;backface-visibility:hidden!important;background:#050505!important}
      #work .work-card::after{content:"";position:absolute;inset:0;z-index:25;pointer-events:none;background:radial-gradient(circle at center,transparent 42%,rgba(0,0,0,.32) 100%);opacity:0;transition:opacity .45s ease}
      #work .work-card.work-side-left::after,#work .work-card.work-side-right::after{opacity:1}
      .work-nav-button{position:absolute;top:50%;z-index:80;height:40px;width:40px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(10,10,10,.76);color:#fff;transform:translateY(-50%);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:28px;line-height:1;box-shadow:0 18px 48px rgba(0,0,0,.42),0 0 36px rgba(255,90,0,.11);backdrop-filter:blur(16px);transition:transform .22s cubic-bezier(.16,1,.3,1),border-color .22s ease,background .22s ease,color .22s ease,opacity .22s ease}
      .work-nav-button:hover{transform:translateY(-50%) scale(1.12);border-color:rgba(255,90,0,.55);background:#ff5a00;color:#050505}
      .work-nav-button.prev{left:calc(50% - 260px)}
      .work-nav-button.next{right:calc(50% - 260px)}
      @media(max-width:767px){#work .marquee-track{width:100%!important;grid-template-columns:72px 156px 72px!important;gap:8px!important;padding:0 42px!important}#work .work-card.work-main{width:156px!important;height:260px!important}#work .work-card.work-side-left,#work .work-card.work-side-right{width:72px!important;height:132px!important;opacity:.24!important}.work-nav-button{height:36px;width:36px;font-size:24px}.work-nav-button.prev{left:8px}.work-nav-button.next{right:8px}}
    </style>

    <script>
      (()=>{
        const TOTAL=10,VERSION='5';
        let booted=false,current=0,locked=false;
        const cache=[];
        const srcFor=i=>`/work/video-${String((i%TOTAL)+1).padStart(2,'0')}.mp4?v=${VERSION}`;
        const wrap=n=>((n%TOTAL)+TOTAL)%TOTAL;
        const preload=src=>{const v=document.createElement('video');cache.push(v);v.src=src;v.muted=true;v.playsInline=true;v.preload='auto';v.load();};
        [0,1,2].forEach(i=>preload(srcFor(i)));
        const setup=(card,index,active)=>{const v=card.querySelector('video');if(!v)return;const s=v.querySelector('source');const src=srcFor(index);v.muted=true;v.defaultMuted=true;v.playsInline=true;v.loop=true;v.preload=active?'auto':'metadata';if(s&&s.getAttribute('src')!==src){s.setAttribute('src',src);v.load();}if(active)v.play().catch(()=>{});};
        const init=()=>{if(booted)return;const section=document.querySelector('#work');const track=document.querySelector('#work .marquee-track');if(!section||!track)return;const cards=[...track.querySelectorAll('.work-card')].slice(0,TOTAL);if(cards.length<TOTAL)return;booted=true;track.innerHTML='';cards.forEach(card=>track.appendChild(card));const prev=document.createElement('button');prev.className='work-nav-button prev';prev.innerHTML='‹';const next=document.createElement('button');next.className='work-nav-button next';next.innerHTML='›';section.appendChild(prev);section.appendChild(next);
        const apply=(direction=0)=>{const left=wrap(current-1),main=wrap(current),right=wrap(current+1);cards.forEach((card,i)=>{card.classList.remove('work-hidden','work-main','work-side-left','work-side-right');if(i===main){card.classList.add('work-main');card.style.transform=`translate3d(${direction*6}px,0,0) scale(.985)`;requestAnimationFrame(()=>card.style.transform='translate3d(0,0,0) scale(1)');setup(card,i,true);return;}if(i===left){card.classList.add('work-side-left');card.style.transform='translate3d(30px,0,0) scale(.84)';requestAnimationFrame(()=>card.style.transform='translate3d(22px,0,0) scale(.9)');setup(card,i,false);return;}if(i===right){card.classList.add('work-side-right');card.style.transform='translate3d(-30px,0,0) scale(.84)';requestAnimationFrame(()=>card.style.transform='translate3d(-22px,0,0) scale(.9)');setup(card,i,false);return;}card.classList.add('work-hidden');});setTimeout(()=>preload(srcFor(wrap(current+2))),220);setTimeout(()=>preload(srcFor(wrap(current-2))),420);};
        const move=dir=>{if(locked)return;locked=true;current=wrap(current+dir);apply(dir);setTimeout(()=>locked=false,520);};
        prev.onclick=()=>move(-1);next.onclick=()=>move(1);apply();setTimeout(()=>{for(let i=3;i<TOTAL;i++)setTimeout(()=>preload(srcFor(i)),(i-3)*280)},1200);};
        new MutationObserver(init).observe(document.documentElement,{childList:true,subtree:true});addEventListener('DOMContentLoaded',init,{once:true});
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
