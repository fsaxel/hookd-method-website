<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="HOOKD Method — content systems for creators, brands and businesses." />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <link rel="preload" href="/assets/logo.png" as="image" fetchpriority="high" />
    <link rel="preload" href="/work/video-01.mp4?v=5" as="video" type="video/mp4" fetchpriority="high" />
    <link rel="preload" href="/work/video-02.mp4?v=5" as="video" type="video/mp4" fetchpriority="high" />
    <link rel="preload" href="/work/video-03.mp4?v=5" as="video" type="video/mp4" fetchpriority="high" />
    <title>HOOKD Method</title>

    <style>
      #work{position:relative;overflow:hidden!important;padding-top:24px!important;padding-bottom:32px!important}
      #work .marquee-track{animation:none!important;transform:none!important;will-change:auto!important;width:min(100%,980px)!important;max-width:980px!important;margin:0 auto!important;display:grid!important;grid-template-columns:170px 240px 170px!important;justify-content:center!important;align-items:center!important;gap:18px!important;padding:0 58px!important;overflow:visible!important}
      #work .work-card{grid-row:1!important;margin:0!important;min-width:0!important;transition:opacity .42s cubic-bezier(.2,.8,.2,1),transform .42s cubic-bezier(.2,.8,.2,1),filter .42s cubic-bezier(.2,.8,.2,1),box-shadow .42s cubic-bezier(.2,.8,.2,1)!important;will-change:transform,opacity,filter!important;rotate:0deg!important}
      #work .work-card.work-hidden{display:none!important}
      #work .work-card.work-main{grid-column:2!important;width:240px!important;height:420px!important;opacity:1!important;filter:none!important;transform:translate3d(0,0,0) scale(1)!important;z-index:30!important;pointer-events:auto!important;box-shadow:0 26px 90px rgba(255,90,0,.16),0 0 0 1px rgba(255,255,255,.08)!important}
      #work .work-card.work-side-left{grid-column:1!important;width:170px!important;height:302px!important;opacity:.42!important;filter:saturate(.75) brightness(.58)!important;transform:translate3d(12px,0,0) scale(.92)!important;z-index:10!important;pointer-events:none!important;box-shadow:inset 0 0 90px rgba(0,0,0,.75),0 20px 70px rgba(0,0,0,.32)!important}
      #work .work-card.work-side-right{grid-column:3!important;width:170px!important;height:302px!important;opacity:.42!important;filter:saturate(.75) brightness(.58)!important;transform:translate3d(-12px,0,0) scale(.92)!important;z-index:10!important;pointer-events:none!important;box-shadow:inset 0 0 90px rgba(0,0,0,.75),0 20px 70px rgba(0,0,0,.32)!important}
      #work .work-card video{transform:translateZ(0)!important;backface-visibility:hidden!important;background:#050505!important}
      #work .work-card::after{content:"";position:absolute;inset:0;z-index:25;pointer-events:none;background:radial-gradient(circle at center,transparent 42%,rgba(0,0,0,.28) 100%);opacity:0;transition:opacity .3s ease}
      #work .work-card.work-side-left::after,#work .work-card.work-side-right::after{opacity:1}
      .work-nav-button{position:absolute;top:50%;z-index:80;height:42px;width:42px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(10,10,10,.76);color:#fff;transform:translateY(-50%);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:31px;line-height:1;font-weight:500;box-shadow:0 18px 48px rgba(0,0,0,.42),0 0 36px rgba(255,90,0,.11);backdrop-filter:blur(16px);transition:transform .18s ease,border-color .18s ease,background .18s ease,color .18s ease}
      .work-nav-button:hover{transform:translateY(-50%) scale(1.08);border-color:rgba(255,90,0,.55);background:#ff5a00;color:#050505}
      .work-nav-button.prev{left:calc(50% - 340px)}
      .work-nav-button.next{right:calc(50% - 340px)}
      #work::before,#work::after{content:"";position:absolute;top:0;bottom:0;z-index:50;width:18vw;max-width:250px;pointer-events:none}
      #work::before{left:0;background:linear-gradient(90deg,#050505 0%,rgba(5,5,5,.76) 42%,rgba(5,5,5,0) 100%)}
      #work::after{right:0;background:linear-gradient(270deg,#050505 0%,rgba(5,5,5,.76) 42%,rgba(5,5,5,0) 100%)}
      @media(max-width:767px){#work{padding-top:18px!important;padding-bottom:26px!important}#work .marquee-track{width:100%!important;grid-template-columns:1fr 156px 1fr!important;gap:10px!important;padding:0 50px!important}#work .work-card.work-main{width:156px!important;height:248px!important}#work .work-card.work-side-left,#work .work-card.work-side-right{width:86px!important;height:154px!important;opacity:.34!important}.work-nav-button{height:38px;width:38px;font-size:27px}.work-nav-button.prev{left:14px}.work-nav-button.next{right:14px}}
    </style>

    <script>
      (()=>{
        const TOTAL=10;
        const VERSION='5';
        let booted=false;
        let current=0;
        const preloadCache=[];
        const srcFor=(i)=>`/work/video-${String((i%TOTAL)+1).padStart(2,'0')}.mp4?v=${VERSION}`;
        const wrap=(n)=>((n%TOTAL)+TOTAL)%TOTAL;
        const preload=(src)=>{const v=document.createElement('video');preloadCache.push(v);v.src=src;v.muted=true;v.defaultMuted=true;v.playsInline=true;v.loop=true;v.preload='auto';v.load();};
        [0,1,2].forEach(i=>preload(srcFor(i)));
        const setupVideo=(card,index,active)=>{const v=card.querySelector('video');if(!v)return;const s=v.querySelector('source');const src=srcFor(index);v.muted=true;v.defaultMuted=true;v.playsInline=true;v.loop=true;v.preload=active?'auto':'metadata';v.style.transform='translateZ(0)';v.style.backfaceVisibility='hidden';if(s&&s.getAttribute('src')!==src){s.setAttribute('src',src);v.load();}else if(!s&&v.getAttribute('src')!==src){v.setAttribute('src',src);v.load();}if(active)v.play().catch(()=>{});else v.pause();};
        const init=()=>{if(booted)return;const section=document.querySelector('#work');const track=document.querySelector('#work .marquee-track');if(!section||!track)return;const cards=[...track.querySelectorAll('.work-card')].slice(0,TOTAL);if(cards.length<TOTAL)return;booted=true;track.innerHTML='';cards.forEach((card,i)=>{card.dataset.index=String(i);card.classList.remove('work-hidden','work-main','work-side-left','work-side-right','work-edge');track.appendChild(card);});const prev=document.createElement('button');prev.type='button';prev.className='work-nav-button prev';prev.setAttribute('aria-label','Previous work video');prev.innerHTML='‹';const next=document.createElement('button');next.type='button';next.className='work-nav-button next';next.setAttribute('aria-label','Next work video');next.innerHTML='›';section.appendChild(prev);section.appendChild(next);const apply=()=>{const left=wrap(current-1),main=wrap(current),right=wrap(current+1);cards.forEach((card,i)=>{card.classList.remove('work-hidden','work-main','work-side-left','work-side-right','work-edge');if(i===main){card.classList.add('work-main');setupVideo(card,i,true);return;}if(i===left){card.classList.add('work-side-left');setupVideo(card,i,false);return;}if(i===right){card.classList.add('work-side-right');setupVideo(card,i,false);return;}card.classList.add('work-hidden');setupVideo(card,i,false);});setTimeout(()=>preload(srcFor(wrap(current+2))),250);setTimeout(()=>preload(srcFor(wrap(current-2))),500);};prev.onclick=()=>{current=wrap(current-1);apply();};next.onclick=()=>{current=wrap(current+1);apply();};apply();setTimeout(()=>{for(let i=3;i<TOTAL;i++)setTimeout(()=>preload(srcFor(i)),(i-3)*350)},1600);};new MutationObserver(init).observe(document.documentElement,{childList:true,subtree:true});addEventListener('DOMContentLoaded',init,{once:true});addEventListener('load',init,{once:true});
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
